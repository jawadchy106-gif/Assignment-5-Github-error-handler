<!DOCTYPE html>
<html>
<head>
<title>GitHub Issues Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-xl rounded-xl w-[480px] p-10 text-center">

<!-- Logo -->

<img src="assets/github-logo.png"
class="w-20 mx-auto mb-4">

<!-- Title -->

<h1 class="text-2xl font-bold text-gray-800">
GitHub Issues Tracker
</h1>

<p class="text-gray-500 mt-2 mb-8">
Sign in to manage your issues
</p>


<!-- Username -->

<div class="text-left mb-5">

<label class="font-semibold text-gray-700">
Username
</label>

<input id="username"
type="text"
placeholder="Enter Username"
class="w-full border border-gray-300 rounded-lg p-3 mt-2">

<p class="text-blue-600 text-sm mt-1">
Default: admin
</p>

</div>


<!-- Password -->

<div class="text-left mb-6">

<label class="font-semibold text-gray-700">
Password
</label>

<input id="password"
type="password"
placeholder="Enter Password"
class="w-full border border-gray-300 rounded-lg p-3 mt-2">

<p class="text-blue-600 text-sm mt-1">
Default: admin123
</p>

</div>


<!-- Sign In Button -->

<button onclick="login()"
class="w-full py-3 rounded-lg text-white font-semibold
bg-purple-600 hover:bg-purple-700 transition">

Sign In

</button>


<!-- OR Divider -->

<div class="flex items-center my-6">

<div class="flex-grow border-t border-gray-300"></div>

<span class="px-3 text-gray-500">
OR
</span>

<div class="flex-grow border-t border-gray-300"></div>

</div>


<!-- Demo Credentials -->

<p class="text-gray-500 mb-3">
Demo Credentials:
</p>

<div class="bg-gray-100 rounded-lg p-5 text-left">

<p class="font-semibold">
Username: <span class="font-normal">admin</span>
</p>

<p class="font-semibold">
Password: <span class="font-normal">admin123</span>
</p>

</div>

</div>


<script src="js/login.js"></script>

</body>
</html>
